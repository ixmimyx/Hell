<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0a0a0c" />
<title>HELL — Lucy</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Metal+Mania&family=Creepster&display=swap" rel="stylesheet" />
<style>
  @font-face{
    font-family:'Horror Vision';
    src:url(assets/HorrorVision.ttf) format('truetype');
    font-display:swap;
  }
  :root{
    --bg:#0a0a0c;
    --panel:#101013;
    --panel2:#17171c;
    --line:rgba(255,255,255,.08);
    --txt:#f5f3f3;
    --muted:#9d9898;
    --accent:#a51414;      /* أحمر داكن */
    --accent2:#c02a1d;
    --accent-deep:#7c0b0b;
    --tintA:rgba(130,8,8,.32);
    --tintB:rgba(25,0,0,.45);
  }
  /* وضع أبيض وأسود للصفحة كلها */
  html{transition:filter .35s ease}
  html.bw{filter:grayscale(1)}

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--txt);
    font-family:'Poppins','Segoe UI',Tahoma,sans-serif;
    font-weight:600;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  /* ماوس على شكل فراشة بسهم صغير، أحمر غامق */
  body, body *{
    cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 40 40'><path d='M26 24C23.5 16.5 17 12.5 14.5 15.2c-2.3 2.6 2.3 8.4 11.5 8.8z' fill='%2396100f' stroke='%23b31515' stroke-width='.6'/><path d='M28 24c2.5-7.5 9-11.5 11.5-8.8 2.3 2.6-2.3 8.4-11.5 8.8z' fill='%23780b0b' stroke='%23b31515' stroke-width='.6'/><path d='M26 27.5c-6.5 1-11 4.8-9.4 7.6 1.5 2.8 7.8.7 9.4-7.6z' fill='%23780b0b' stroke='%23b31515' stroke-width='.6'/><path d='M28 27.5c6.5 1 11 4.8 9.4 7.6-1.5 2.8-7.8.7-9.4-7.6z' fill='%2396100f' stroke='%23b31515' stroke-width='.6'/><path d='M26.6 21.9c-.8-2.7-2.6-4.1-4.3-4.7M27.4 21.9c.8-2.7 2.6-4.1 4.3-4.7' fill='none' stroke='%23b31515' stroke-width='.8' stroke-linecap='round'/><ellipse cx='27' cy='27' rx='1.5' ry='5.6' fill='%233a0404' stroke='%23b31515' stroke-width='.5'/><path d='M2 2L2 13.5L5.2 10.6L7.6 16L10.1 14.9L7.8 9.8L12.4 9.6Z' fill='%238c0d0d' stroke='%23c02a1d' stroke-width='1' stroke-linejoin='round'/></svg>") 2 2, auto;
  }

  /* خلفية صورة البنت ورا الصفحة كلها */
  .bg{
    position:fixed;inset:0;z-index:0;
    background:url(assets/demon.jpg) center/cover no-repeat;
    filter:blur(6px) brightness(.82) saturate(1.05);
    transform:scale(1.04);
  }
  .bg::after{
    content:"";
    position:absolute;inset:0;
    background:
      linear-gradient(180deg, rgba(0,0,0,.62), rgba(0,0,0,.18) 24%, transparent 42%),
      radial-gradient(70% 60% at 20% 12%, var(--tintA), transparent 65%),
      radial-gradient(75% 70% at 85% 92%, var(--tintB), transparent 70%),
      radial-gradient(120% 100% at 50% 50%, transparent 55%, rgba(0,0,0,.3) 100%);
  }
  .stars{
    position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
    background-image:
      radial-gradient(1.2px 1.2px at 22px 26px, #fff, transparent),
      radial-gradient(1px 1px at 78px 98px, rgba(255,255,255,.85), transparent),
      radial-gradient(1.6px 1.6px at 150px 46px, #fff, transparent),
      radial-gradient(1px 1px at 204px 132px, rgba(255,255,255,.7), transparent),
      radial-gradient(1.3px 1.3px at 112px 174px, rgba(255,255,255,.9), transparent),
      radial-gradient(1.4px 1.4px at 36px 148px, #fff, transparent),
      radial-gradient(1px 1px at 268px 188px, rgba(255,255,255,.8), transparent),
      radial-gradient(1.5px 1.5px at 318px 64px, #fff, transparent);
    background-size:240px 200px, 240px 200px, 240px 200px, 240px 200px, 240px 200px,
                    340px 280px, 340px 280px, 340px 280px;
  }

  /* نقط نيون حمرا طالعة من تحت لفوق على الصفحة */
  .sparks{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
  .sparks i{
    position:absolute;bottom:-10px;
    border-radius:50%;
    background:#a31212;
    box-shadow:0 0 6px rgba(200,0,0,.9), 0 0 16px rgba(140,0,0,.8);
    opacity:0;
    animation:rise-snow linear infinite;
  }
  @keyframes rise-snow{
    0%{transform:translate(0,0) scale(.7);opacity:0}
    10%{opacity:1}
    85%{opacity:.85}
    100%{transform:translate(var(--dx,20px), -110vh) scale(1.05);opacity:0}
  }

  /* أزرار ثابتة تحت في آخر الصفحة بحجم مقروء على أي شاشة */
  .topbar{
    position:fixed;left:0;right:0;bottom:0;top:auto;z-index:20;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 18px calc(14px + env(safe-area-inset-bottom, 0px));
    pointer-events:none;
  }
  .topbar > *{pointer-events:auto}
  .pill{
    display:inline-flex;align-items:center;gap:9px;
    padding:9px 16px;border-radius:999px;
    background:var(--accent);
    border:1px solid var(--accent2);
    color:#fff;
    font-family:inherit;font-size:10.5px;font-weight:700;
    letter-spacing:.18em;text-transform:uppercase;
    text-decoration:none;cursor:pointer;
    backdrop-filter:blur(8px);
    transition:background .2s, border-color .2s, color .2s, transform .15s;
  }
  .pill:hover{background:#fff;border-color:#fff;color:var(--accent-deep)}
  .pill:active{transform:scale(.97)}
  .pill .arrow{font-size:13px;letter-spacing:0;line-height:1}

  .icon{display:inline-flex;align-items:center;gap:5px}
  .icon svg{width:13px;height:13px;display:block;transition:opacity .2s}
  .icon .i-sun{opacity:.45}
  html.bw .icon .i-sun{opacity:1}
  html.bw .icon .i-moon{opacity:.45}

  /* في الوضع الأبيض وأسود النيون بيبقى أبيض بدل الأحمر */
  html.bw .sparks i{
    background:#fff;
    box-shadow:0 0 6px rgba(255,255,255,.95), 0 0 16px rgba(255,255,255,.7);
  }

  /* مسرح الصفحة: الكارت بيتصغّر كوحدة واحدة بنفس التخطيط */
  .stage{
    position:fixed;inset:0;z-index:1;
    overflow:hidden;
  }

  .card{
    position:absolute;
    left:50%;
    top:50%; /* JS بيحسب المسافة تحت كلمة HELL */
    width:1000px;
    height:980px; /* ارتفاع ثابت عشان الكارت ما يتغيّرش مع الصور */
    grid-template-rows:minmax(0,1fr);
    flex:none;
    display:grid;
    grid-template-columns:340px minmax(0,1fr);
    gap:26px;
    padding:26px;
    border-radius:26px;
    background:linear-gradient(180deg, rgba(16,16,19,.92), rgba(9,9,11,.95));
    border:1px solid var(--line);
    box-shadow:
      0 40px 90px rgba(0,0,0,.55),
      0 0 0 1px rgba(0,0,0,.35),
      inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter:blur(16px) saturate(1.05);
    transform-origin:center center;
    will-change:transform;
  }

  .col-left{display:flex;flex-direction:column;min-width:0}

  /* صورة دائرية فوق + خانة واحدة فيها الاسم والرقم */
  .profile{display:flex;align-items:center;gap:16px}
  .avatar-wrap{position:relative;flex:none;width:106px;aspect-ratio:1}
  /* فريم متحرك: نقط حمرا بتلف حوالين الصورة */
  .ring{
    position:absolute;inset:-9px;z-index:0;
    color:var(--accent2);
    animation:spin 8s linear infinite;
    filter:drop-shadow(0 0 5px rgba(190,0,0,.85));
  }
  .ring svg{width:100%;height:100%;display:block}
  .avatar{
    position:relative;z-index:1;
    width:100%;height:100%;padding:0;
    border:0;background:none;
    display:block;
    border-radius:50%;overflow:hidden;
    cursor:pointer;
    box-shadow:0 0 0 2px var(--accent), 0 0 30px var(--tintA), 0 16px 28px rgba(0,0,0,.55);
  }
  .avatar img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
  .avatar:hover img{transform:scale(1.07)}

  /* الصورة الكبيرة لما تدوس على صورة البروفايل */
  .lightbox{
    position:fixed;inset:0;z-index:60;
    display:grid;place-items:center;
    background:rgba(4,0,0,.88);
    backdrop-filter:blur(6px);
    padding:24px;
  }
  .lightbox[hidden]{display:none}
  .lightbox img{
    max-width:min(720px, 88vw);max-height:86vh;
    border:2px solid var(--accent2);border-radius:20px;
    box-shadow:0 0 60px rgba(160,0,0,.55), 0 40px 80px rgba(0,0,0,.6);
    animation:pop .3s ease-out;
  }
  @keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}

  .id-text{
    flex:1 1 auto;min-width:0;
    display:flex;flex-direction:column;gap:2px;
  }
  .id-text .p-name{font-size:18px;font-weight:700;color:#fff}
  .id-text .p-id{font-size:12.5px;font-weight:600;letter-spacing:.08em;color:#fff;opacity:.75}

  /* أشكال سوشيال حمرا في المنتصف وتبقى بيضا على الهوفر */
  .socials{display:flex;justify-content:center;gap:10px;margin-top:18px}
  .social{
    width:40px;height:40px;border-radius:50%;
    display:grid;place-items:center;
    background:var(--accent);border:1px solid var(--accent2);
    color:#fff;cursor:default;
    transition:background .25s, color .25s, border-color .25s, box-shadow .3s;
  }
  .social svg{width:16px;height:16px;fill:currentColor}
  .social:hover{
    background:#fff;
    color:var(--accent-deep);
    border-color:#fff;
    box-shadow:0 0 18px rgba(255,255,255,.5);
  }

  /* كلمة Gallery زي الأول فوق المشغل */
  .gallery{
    display:block;width:max-content;
    margin:16px auto 0;
    padding:8px 32px;border-radius:999px;
    border:1px solid var(--accent2);
    background:var(--accent);
    color:#fff;font-size:10.5px;font-weight:600;letter-spacing:.06em;
    text-align:center;white-space:nowrap;
    box-shadow:0 10px 26px -16px var(--accent);
  }

  /* صور المعرض جنب بعض في أعمدة صغيرة، والدوس على أي صورة يظهرها في المربع الكبير */
  .gallery-slot{position:relative;flex:1 1 auto;min-height:0;margin-top:14px}
  .thumbs{
    position:absolute;inset:0;
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-auto-rows:1fr;
    gap:8px;
  }
  .thumb{
    position:relative;display:block;padding:0;
    border-radius:14px;overflow:hidden;
    border:1px solid var(--line);
    background:#000;
    transition:border-color .25s, box-shadow .25s;
  }
  .thumb img{
    width:100%;height:100%;object-fit:cover;display:block;
    user-select:none;-webkit-user-drag:none;
    transition:transform .35s ease;
  }
  .thumb:hover img{transform:scale(1.06)}
  .thumb.active{
    border-color:var(--accent2);
    box-shadow:0 0 0 1px var(--accent2), 0 0 16px rgba(170,0,0,.45);
  }
  .thumb:last-child{grid-column:1 / -1}

  /* مشغل MP3 أحمر داكن على أسود */
  .player{
    margin-top:18px;
    display:grid;
    grid-template-columns:auto minmax(0,1fr) auto;
    grid-template-areas:
      "disc meta play"
      "bar bar bar"
      "times times times";
    gap:12px;
    padding:14px;
    border-radius:18px;
    background:
      radial-gradient(130% 130% at 0% 0%, var(--tintA), transparent 55%),
      #08080a;
    border:1px solid var(--line);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 18px 40px -22px #000;
  }
  .disc{
    grid-area:disc;
    width:46px;height:46px;border-radius:50%;overflow:hidden;
    border:2px solid var(--accent2);
    box-shadow:0 0 18px var(--tintA);
    background:#000;
  }
  .disc img{
    width:100%;height:100%;object-fit:cover;display:block;
    animation:spin 7s linear infinite;
    animation-play-state:paused;
  }
  .player.playing .disc img{animation-play-state:running}
  @keyframes spin{to{rotate:360deg}}

  .meta{grid-area:meta;min-width:0;align-self:center}
  .track{
    font-size:11.5px;font-weight:700;color:#fff;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .artist{
    margin-top:3px;
    font-size:8.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent2);
  }

  .play{
    grid-area:play;
    width:42px;height:42px;border-radius:50%;border:0;
    display:grid;place-items:center;
    background:var(--accent);color:#fff;
    cursor:pointer;
    box-shadow:0 0 22px var(--tintA);
    transition:transform .15s, background .2s, color .2s;
  }
  .play:hover{background:#fff;color:var(--accent-deep)}
  .play:active{transform:scale(.93)}
  .play svg{width:15px;height:15px}
  .ic-pause{display:none}
  .player.playing .ic-play{display:none}
  .player.playing .ic-pause{display:block}

  .bar{
    grid-area:bar;
    position:relative;
    height:4px;border-radius:4px;
    background:rgba(255,255,255,.13);
    cursor:pointer;
  }
  .bar::before{content:"";position:absolute;inset:-10px 0}
  .bar .fill{
    position:absolute;left:0;top:0;bottom:0;width:0%;
    border-radius:4px;background:var(--accent2);
    box-shadow:0 0 10px var(--accent2);
  }
  .times{
    grid-area:times;
    display:flex;justify-content:space-between;
    margin-top:-4px;
    font-size:9px;font-weight:600;letter-spacing:.08em;color:var(--muted);
  }

  /* الصورة الكبيرة على اليمين: إطار أحمر وكتابة حمرا */
  .col-right{display:grid;grid-template-rows:minmax(0,1fr);place-items:stretch;min-width:0}
  .post{
    justify-self:center;
    width:100%;max-width:560px;
    height:100%;min-height:0;
    display:flex;flex-direction:column;
    background:linear-gradient(180deg, rgba(24,7,7,.94), rgba(9,2,2,.97));
    border:2px solid var(--accent2);
    border-radius:26px;
    overflow:hidden;
    box-shadow:0 0 55px -14px var(--accent), 0 34px 70px rgba(0,0,0,.55);
  }
  .post-img{flex:1 1 0;min-height:0;overflow:hidden;background:#111}
  .post-img img{
    width:100%;height:100%;object-fit:cover;display:block;
    transition:opacity .34s ease, transform .5s ease, filter .34s ease;
  }
  /* الصورة القديمة تختفي، والجديدة تظهر بميل ووضوح */
  .post-img img.out{opacity:0;transform:scale(1.07);filter:blur(5px)}
  .post-body{padding:14px 18px 18px;color:var(--accent2)}
  .post-icons{display:flex;align-items:center;gap:14px;color:var(--accent2)}

  /* القلب: يدوس عليه فيتعبّى أحمر */
  .like{
    background:none;border:0;cursor:pointer;
    padding:6px;margin:-6px;
    display:grid;place-items:center;color:var(--accent2);
    transition:transform .15s, filter .25s, color .2s;
  }
  .like svg{width:23px;height:23px;fill:transparent;stroke:currentColor;transition:fill .2s}
  .like:active{transform:scale(.94)}
  .like.liked{filter:drop-shadow(0 0 10px var(--accent2))}
  .like.liked svg{fill:currentColor;animation:beat .35s ease}
  .like:hover{transform:scale(1.12);color:#fff;filter:drop-shadow(0 0 9px rgba(255,255,255,.65))}
  @keyframes beat{
    0%{transform:scale(.65)}
    55%{transform:scale(1.18)}
    100%{transform:scale(1)}
  }

  .post-user{margin-top:12px;font-size:12px;font-weight:700;color:var(--accent2)}
  .post-cap{margin-top:4px;font-size:11.5px;font-weight:500;line-height:1.6;color:var(--accent2);opacity:.8}

  /* فوق الصفحة في المنتصف: HELL أحمر بيضوي وبعده الاسم بيتكتب حرف حرف */
  .intro{
    position:fixed;left:0;right:0;top:62px;z-index:15;
    display:flex;flex-direction:column;align-items:center;gap:0px;
    pointer-events:none;text-align:center;
  }
  /* تعتيم ناعم ورا العنوان عشان الأحمر الغامق يبان */
  .intro::before{
    content:"";
    position:absolute;left:50%;top:46%;
    width:min(640px, 96vw);height:150%;
    transform:translate(-50%,-50%);
    background:radial-gradient(50% 50% at 50% 50%, rgba(0,0,0,.72), rgba(0,0,0,.32) 55%, transparent 80%);
    pointer-events:none;z-index:-1;
  }
  .intro-hell{
    font-family:'Horror Vision','Metal Mania','Poppins',sans-serif;
    font-size:clamp(76px, 10vw, 118px);
    line-height:1;
    color:#c01818; /* أحمر غامق */
    -webkit-text-stroke:2px #000; /* استروك أسود */
    paint-order:stroke fill;
    opacity:0;
    transform:translateY(-6px) scale(.97);
    transition:opacity 1.6s ease, transform 1.6s ease; /* ظهور أبطأ */
  }
  .intro-hell.show{opacity:1;transform:none}
  .intro-name{
    margin-top:18px; /* تحت HELL من غير ما الحروف تقطعها */
    min-height:1.5em;
    font-family:'Creepster','Poppins',sans-serif;
    font-size:clamp(14px, 1.7vw, 19px);
    letter-spacing:.22em;text-indent:.22em;text-transform:uppercase;
    color:#b31515; /* أحمر غامق */
    text-shadow:0 0 12px rgba(170,0,0,.8);
  }
</style>
<script>
  // الصفحة تفتح على آخر وضع اختاره المستخدم (أبيض وأسود أو ألوان)
  try { if (localStorage.getItem('hell-bw') === '1') document.documentElement.classList.add('bw'); } catch (e) {}
</script>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="stars" aria-hidden="true"></div>
  <div class="sparks" id="sparks" aria-hidden="true"></div>

  <header class="topbar">
    <!-- زر الرجوع لصفحة الباب -->
    <a class="pill" href="index.html"><span class="arrow">←</span> Back</a>
    <!-- زر واحد: أبيض وأسود / رجوع للألوان -->
    <button class="pill" id="themeBtn" aria-pressed="false">
      <span class="icon" aria-hidden="true">
        <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.6v2.3M12 19.1v2.3M2.6 12h2.3M19.1 12h2.3M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24"><path d="M20.6 14.6A8.8 8.8 0 0 1 9.4 3.4a8.8 8.8 0 1 0 11.2 11.2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </span>
      Switch
    </button>
  </header>

  <!-- HELL بتظهر وتختفي والاسم بيتكتب تحتها -->
  <div class="intro" id="intro" aria-hidden="true">
    <div class="intro-hell" id="hellWord">HELL</div>
    <div class="intro-name" id="hellName"></div>
  </div>

  <main class="stage">
    <section class="card" id="card">
      <div class="col-left">
        <div class="profile">
          <div class="avatar-wrap">
            <span class="ring" aria-hidden="true">
              <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46.5" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="0.1 11.4"/></svg>
            </span>
            <button class="avatar" type="button" id="avatarBtn" aria-label="Open profile photo">
              <img src="assets/demon.jpg" alt="Lucy" />
            </button>
          </div>
          <!-- الاسم والرقم جنب الصورة من غير خانة -->
          <div class="id-text">
            <span class="p-name">Lucy</span>
            <span class="p-id">187889870</span>
          </div>
        </div>

        <!-- 5 أشكال سوشيال (شكل بس، مش لينكات) -->
        <div class="socials" aria-hidden="true">
          <span class="social">

        <span class="gallery">Gallery</span>

        <div class="gallery-slot">
          <div class="thumbs" id="thumbs">
            <button class="thumb active" type="button" data-src="assets/g1.jpg" aria-label="Photo 1"><img src="assets/g1.jpg" alt="" /></button>
            <button class="thumb" type="button" data-src="assets/g2.jpg" aria-label="Photo 2"><img src="assets/g2.jpg" alt="" /></button>

        <!-- مشغل الأغنية -->
        <div class="player" id="player">
          <div class="disc"><img src="assets/demon.jpg" alt="" /></div>

            <svg class="ic-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg>
            <svg class="ic-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="5" width="3.6" height="14" rx="1.2" fill="currentColor"/><rect x="13.4" y="5" width="3.6" height="14" rx="1.2" fill="currentColor"/></svg>

          <div class="bar" id="bar" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">

              <button class="like" id="likeBtn" aria-pressed="false" aria-label="Like">
                <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 1 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>

  </main>

  <div class="lightbox" id="lightbox" hidden>
    <img src="assets/demon.jpg" alt="Lucy" />
  </div>

  <audio id="audio" src="assets/song.mp3" preload="metadata"></audio>

<script>
  // منع كليك يمين على الصفحة
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  /* نفس التخطيط على الفون والكمبيوتر: الكارت بيتصغّر كوحدة واحدة
     وبيتوسّط في المساحة اللي تحت كلمة HELL */
  const card = document.getElementById('card');
  const intro = document.getElementById('intro');
  const topbar = document.querySelector('.topbar');
  function fit(){
    const topSpace = intro.getBoundingClientRect().bottom + 16;
    // نسيب مساحة الشريط اللي تحت عشان ما يداراش على الكارت
    const barSpace = topbar ? topbar.offsetHeight + 10 : 48;
    const avail = innerHeight - topSpace - 24 - barSpace;
    const s = Math.min(
      (innerWidth - 28) / 1000,
      avail / card.offsetHeight
    );
    card.style.top = (topSpace + avail / 2) + 'px';
    card.style.transform = 'translate(-50%,-50%) scale(' + Math.max(0.2, s) + ')';
  }
  addEventListener('resize', fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  if ('ResizeObserver' in window) new ResizeObserver(fit).observe(card);
  fit();

  // نقط النيون: بتطلع من تحت لفوق على الصفحة كلها
  const sparks = document.getElementById('sparks');
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches){
    for (let i = 0; i < 70; i++){
      const dot = document.createElement('i');
      const size = (1.6 + Math.random() * 2.4).toFixed(1);
      dot.style.left = (Math.random() * 100).toFixed(2) + '%';
      dot.style.width = size + 'px';
      dot.style.height = size + 'px';
      dot.style.animationDuration = (8 + Math.random() * 8).toFixed(2) + 's';
      dot.style.animationDelay = (-Math.random() * 16).toFixed(2) + 's';
      dot.style.setProperty('--dx', (Math.random() * 72 - 36).toFixed(0) + 'px');
      dot.style.opacity = (0.35 + Math.random() * 0.5).toFixed(2);
      sparks.appendChild(dot);
    }
  }

  // صور المعرض جنب بعض: الدوس على أي صورة يظهرها في المربع الكبير
  const postImg = document.getElementById('postImg');
  const thumbs = [...document.querySelectorAll('#thumbs .thumb')];

  function showPost(src){
    if (postImg.getAttribute('src') === src) return;
    postImg.classList.add('out');
    setTimeout(() => {
      postImg.onload = () => { postImg.onload = null; postImg.classList.remove('out'); };
      postImg.src = src;
      if (postImg.complete) postImg.classList.remove('out');
    }, 320);
  }

  const setActive = (t) => thumbs.forEach((o) => o.classList.toggle('active', o === t));

  thumbs.forEach((t) => {
    t.addEventListener('click', () => {
      setActive(t);
      showPost(t.dataset.src);
    });
  });
  // أول صورة هي اللي بتظهر أول ما الصفحة تفتح
  setActive(thumbs[0]);
  postImg.src = thumbs[0].dataset.src;

  // صورة البروفايل تتفتح كبيرة، وتقفل بالدوس في أي حتة أو Esc
  const avatarBtn = document.getElementById('avatarBtn');
  const lightbox = document.getElementById('lightbox');
  avatarBtn.addEventListener('click', () => { lightbox.hidden = false; });
  lightbox.addEventListener('click', () => { lightbox.hidden = true; });
  addEventListener('keydown', (e) => { if (e.key === 'Escape') lightbox.hidden = true; });

  // القلب بيدوس عليه فيتعبّى
  const likeBtn = document.getElementById('likeBtn');
  likeBtn.addEventListener('click', () => {
    const on = likeBtn.classList.toggle('liked');
    likeBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
  });

  // HELL تظهر بالراحة، والاسم بيتكتب حرف حرف وبعدها بيثبتوا ومش بيختفوا
  const hellWord = document.getElementById('hellWord');
  const hellName = document.getElementById('hellName');
  const NAME = 'Lucy 187889870';

  // نتأكد إن خط الاسم وخط HELL اتحمّلوا قبل الكتابة والقياس
  if (document.fonts && document.fonts.load){
    document.fonts.load('16px Creepster', NAME).catch(() => {});
    document.fonts.load('60px "Horror Vision"', 'HELL').then(() => fit()).catch(() => {});
  }

  setTimeout(() => {
    hellWord.classList.add('show');
    setTimeout(() => {
      let i = 0;
      const t = setInterval(() => {
        hellName.textContent = NAME.slice(0, ++i);
        if (i >= NAME.length) clearInterval(t);
      }, 230);
    }, 1600);
  }, 500);

  // زرار واحد بس: يقلب الصفحة أبيض وأسود أو يرجعها طبيعية
  const themeBtn = document.getElementById('themeBtn');
  const setBW = (on) => {
    document.documentElement.classList.toggle('bw', on);
    themeBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    try { localStorage.setItem('hell-bw', on ? '1' : '0'); } catch (e) {}
  };
  themeBtn.addEventListener('click', () => {
    setBW(!document.documentElement.classList.contains('bw'));
  });
  themeBtn.setAttribute('aria-pressed',
    document.documentElement.classList.contains('bw') ? 'true' : 'false');

  // مشغل الأغنية
  const audio = document.getElementById('audio');
  const player = document.getElementById('player');
  const playBtn = document.getElementById('playBtn');
  const bar = document.getElementById('bar');
  const fill = document.getElementById('fill');
  const cur = document.getElementById('cur');
  const dur = document.getElementById('dur');

  const fmt = (s) => {
    s = Math.max(0, Math.floor(s || 0));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  };

  // الموسيقى تشتغل أول ما الصفحة تفتح، ولو المتصفح منعها أول لمسة بتشغلها
  let musicStarted = false;
  const stopUnlock = () => {
    document.removeEventListener('pointerdown', unlockMusic);
    document.removeEventListener('keydown', unlockMusic);
  };
  const startMusic = () => {
    if (musicStarted) return;
    audio.play().then(() => { musicStarted = true; stopUnlock(); }).catch(() => {});
  };
  const unlockMusic = (e) => {
    if (e.target.closest && e.target.closest('#playBtn')) return;
    startMusic();
  };
  startMusic();
  document.addEventListener('pointerdown', unlockMusic);
  document.addEventListener('keydown', unlockMusic);

  playBtn.addEventListener('click', () => {
    if (audio.paused) audio.play().catch(() => {});
    else audio.pause();
  });

  audio.addEventListener('play', () => { player.classList.add('playing'); musicStarted = true; stopUnlock(); });
  audio.addEventListener('pause', () => player.classList.remove('playing'));
  const setDur = () => { if (isFinite(audio.duration)) dur.textContent = fmt(audio.duration); };
  audio.addEventListener('loadedmetadata', setDur);
  audio.addEventListener('durationchange', setDur);
  setDur();
  audio.addEventListener('timeupdate', () => {
    const p = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
    fill.style.width = p + '%';
    bar.setAttribute('aria-valuenow', Math.round(p));
    cur.textContent = fmt(audio.currentTime);
  });

  let seeking = false;
  const seek = (e) => {
    const r = bar.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    if (audio.duration) audio.currentTime = ratio * audio.duration;
  };
  bar.addEventListener('pointerdown', (e) => {
    seeking = true;
    seek(e);
    try { bar.setPointerCapture(e.pointerId); } catch (_) {}
  });
  bar.addEventListener('pointermove', (e) => { if (seeking) seek(e); });
  bar.addEventListener('pointerup', () => { seeking = false; });
  bar.addEventListener('keydown', (e) => {
    if (!audio.duration) return;
    if (e.key === 'ArrowRight') audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
    if (e.key === 'ArrowLeft') audio.currentTime = Math.max(0, audio.currentTime - 5);
  });
</script>
